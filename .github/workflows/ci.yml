name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      APP_ENV: ci
      LOG_LEVEL: INFO
      PORT: "8000"
      EVENTS_PROVIDER_BASE_URL: http://localhost:8000
      EVENTS_PROVIDER_API_KEY: ${{ secrets.LMS_API_KEY }}
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
      SYNC_INTERVAL_SECONDS: "86400"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

